[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[project]
name = "phywae"
version = "0.3.0"
description = "PhyWAE: a phylogenetic Wasserstein autoencoder for Phyddle-formatted data."
readme = "README.md"
authors = [
    {name = "Ammon Thompson", email = "ammonthompson@gmail.com"},
    {name = "Michael Landis", email = "michael.landis@wustl.edu"},
]
license = {text = "MIT"}
keywords = ["autoencoder", "bioinformatics", "phylogenetics", "machine learning", "deep learning"]
dependencies = [
    "dendropy >=5.0.8, <6.0",
    "h5py >=3.12.1, <4.0",
    "matplotlib >=3.10.0, <4.0",
    "numpy>=1.26.4,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=2.2.2,<3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "pandas >=2.2.3, <3.0",
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.6,<3; sys_platform != 'darwin' or platform_machine != 'x86_64'"
]
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "pytest >=9.0, <10.0",
]

[project.scripts]
phywae = "phywae.cli:main"

[tool.hatch.build]
exclude = ["sandbox/**", "*.egg-info/**", "__pycache__/**", "*.pyc", "*.pyo", "*.log", ".git/**", "tests/**", "dev/**", ".vscode/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/phywae"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "docs", "example", "README.md", "CHANGELOG.md", "pyproject.toml", "phytrain_config.py", ".python-version"]
